services:
  mongo:
    image: mongo:7
    container_name: mplads_mongo
    restart: unless-stopped
    volumes: [mplads_mongo_data:/data/db]
    networks: [mplads_net]
  backend:
    build: { context: ./Backend, dockerfile: Dockerfile }
    container_name: mplads_backend
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      PORT: 8000
      ENVIRONMENT: production
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB_NAME: mplads_ai
    depends_on: [mongo]
    networks: [mplads_net]
  frontend:
    build: { context: ./Frontend, dockerfile: Dockerfile }
    container_name: mplads_frontend
    restart: unless-stopped
    ports: ["3000:80"]
    depends_on: [backend]
    networks: [mplads_net]
networks:
  mplads_net: { driver: bridge }
volumes:
  mplads_mongo_data:
