version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: mplads_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    networks:
      - mplads_net

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: mplads_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - mplads_net

networks:
  mplads_net:
    driver: bridge
